<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Forms</title>
</head>
<body>
    <div class="background-container"></div>

    <main>
        <div class="side-column">
            <h1 class="title">Welcome <span class="row">T-Thenix.</span></h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.  Repellat, quasi.</p>
            <p class="register-label">Register with social media:</p>
            <div class="social-media">
                <button>Facebook</button>
                <button>Github</button>
            </div>
        </div>

        <div class="form-container">
            <p class="title">Register</p>
            <p>Already have an account? <a href="#">Login here instead.</a></p>

            <form id="registrationForm" novalidate>

                <p class="form-row">
                    <label for="first_name">First Name</label>
                    <input 
                        type="text"
                        id="first_name"
                    />
                    <span class="error"></span>
                </p>

                <p class="form-row">
                    <label for="email">Email Address</label>
                    <input 
                        type="email"
                        id="email"
                    />
                    <span class="error"></span>
                </p>

                <p class="form-row">
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                    />
                    <span class="error"></span>
                </p>

                <p class="form-row">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password"
                        id="confirmPassword"
                    />
                    <span class="error"></span>
                </p>

                <p class="form-row">
                    <button type="submit">Register</button>
                </p>
            </form>
        </div>
    </main>
</body>
</html>
